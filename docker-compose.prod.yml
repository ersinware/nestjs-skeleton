# Local production image rehearsal; optional telemetry goes to Grafana Cloud.
services:
    api:
        labels:
            deployment.environment.name: local-prod
        build:
            context: .
            target: production

        env_file:
            - .env

        environment:
            - NODE_ENV=production
            - OTEL_RESOURCE_ATTRIBUTES=service.namespace=${OTEL_SERVICE_NAME:?},deployment.environment.name=local-prod

        ports:
            - '127.0.0.1:3001:3000'

        restart: unless-stopped
