# Local production rehearsal: the `production` image against the same self-hosted datastores as
# dev. `docker:prod:*` also starts and stops the observability stack, so everything production has
# is present and nothing reaches an external service. The real deployment is an ECS task
# definition, not this file.
services:
    api:
        build:
            context: .
            target: production

        env_file:
            - .env

        environment:
            - NODE_ENV=production

        ports:
            - '127.0.0.1:3001:3000'

        restart: unless-stopped
