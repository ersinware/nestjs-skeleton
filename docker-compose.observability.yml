# Observability stack — collector + local stores, shared by the dev run and the local production
# rehearsal. Fully local; optional for dev (the API runs and passes its probes without it).
#
# The API pushes traces + metrics to `otel-collector` and writes logs to stdout; the collector reads
# container stdout from Docker's log files (docker-logs.yml), scrapes the Postgres/Redis exporters
# (scrape.yml), and ships to Tempo, Prometheus and Loki, which Grafana reads.
#
# Production (ECS Fargate + RDS + ElastiCache + Grafana Cloud) runs the same collector as a sidecar
# with config.yml alone, pointed at the Grafana Cloud gateway; FireLens ships stdout and CloudWatch
# supplies the datastore metrics.
#
# A separate Compose project (`npm run docker:obs:*` passes -p), so `down` on the app stack cannot
# touch these containers. The stacks meet only on the external `api-network` bridge.

# Stamps the compose service name — and, where a container carries one, its `service.name` label —
# into each log line; the collector names the source from them (docker-logs.yml).
x-logging: &logging
    driver: json-file
    options:
        labels: com.docker.compose.service,service.name

services:
    tempo:
        image: grafana/tempo:3.0.3@sha256:0296560ac66f8a3600d7fb3014a52c189d4d9c3549ad6ff441bf2409855d68d5
        container_name: tempo
        # Root so the image's non-root user needs no ownership setup on the named volume.
        user: '0'
        command: ['-config.file=/etc/tempo/config.yml']
        volumes:
            - ./docker/tempo/config.yml:/etc/tempo/config.yml:ro
            - tempo_data:/var/tempo
        logging: *logging
        networks:
            - api-network

    prometheus:
        image: prom/prometheus:v3.5.4@sha256:a75c5a35bc21d7afe69551eefa3cb1e1fb1775fe759408007a66b54ec3de1f29
        container_name: prometheus
        volumes:
            - ./docker/prometheus/config.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.enable-otlp-receiver'
            # Tempo's metrics-generator writes here.
            - '--web.enable-remote-write-receiver'
        logging: *logging
        networks:
            - api-network

    loki:
        image: grafana/loki:3.4.2@sha256:58a6c186ce78ba04d58bfe2a927eff296ba733a430df09645d56cdc158f3ba08
        container_name: loki
        # The image's built-in config stores under /loki.
        volumes:
            - loki_data:/loki
        logging: *logging
        networks:
            - api-network

    # Exporters for the self-hosted datastores, scraped by the collector (scrape.yml).
    postgres-exporter:
        image: prometheuscommunity/postgres-exporter:v0.17.1@sha256:38606faa38c54787525fb0ff2fd6b41b4cfb75d455c1df294927c5f611699b17
        container_name: postgres-exporter
        environment:
            - DATA_SOURCE_NAME=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
        logging: *logging
        networks:
            - api-network

    redis-cache-exporter:
        image: oliver006/redis_exporter:v1.67.0@sha256:120f7ec77293459ccfdad66bb1db75ab72e8bfeab99f58b1cc2564cadcd7a9e7
        container_name: redis-cache-exporter
        environment:
            - REDIS_ADDR=redis://redis-cache:6379
            - REDIS_PASSWORD=password
        logging: *logging
        networks:
            - api-network

    redis-session-exporter:
        image: oliver006/redis_exporter:v1.67.0@sha256:120f7ec77293459ccfdad66bb1db75ab72e8bfeab99f58b1cc2564cadcd7a9e7
        container_name: redis-session-exporter
        environment:
            - REDIS_ADDR=redis://redis-session:6379
            - REDIS_PASSWORD=password
        logging: *logging
        networks:
            - api-network

    otel-collector:
        # Contrib: tail_sampling, filelog and the prometheus receiver are not in the core distro.
        image: otel/opentelemetry-collector-contrib:0.157.0@sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6
        container_name: otel-collector
        # Docker's container log directory is root-only.
        user: '0'
        # The container limit the memory_limiter values are sized against; on ECS it is the sidecar's
        # memory reservation.
        mem_limit: ${OTEL_COLLECTOR_CONTAINER_MEMORY_MIB:?}m
        command:
            - '--config=/etc/otelcol-contrib/config.yml'
            - '--config=/etc/otelcol-contrib/docker-logs.yml'
            - '--config=/etc/otelcol-contrib/scrape.yml'
        # Values come from .env, which lists the collector's full environment as the task definition
        # will; an unset one fails `compose up` instead of starting a half-configured collector.
        environment:
            - OTEL_TAIL_SAMPLING_PERCENTAGE=${OTEL_TAIL_SAMPLING_PERCENTAGE:?}
            - OTEL_COLLECTOR_TRACES_ENDPOINT=${OTEL_COLLECTOR_TRACES_ENDPOINT:?}
            - OTEL_COLLECTOR_METRICS_ENDPOINT=${OTEL_COLLECTOR_METRICS_ENDPOINT:?}
            - OTEL_COLLECTOR_LOGS_ENDPOINT=${OTEL_COLLECTOR_LOGS_ENDPOINT:?}
            - OTEL_COLLECTOR_AUTHORIZATION=${OTEL_COLLECTOR_AUTHORIZATION?}
            - OTEL_COLLECTOR_MEMORY_LIMIT_MIB=${OTEL_COLLECTOR_MEMORY_LIMIT_MIB:?}
            - OTEL_COLLECTOR_MEMORY_SPIKE_LIMIT_MIB=${OTEL_COLLECTOR_MEMORY_SPIKE_LIMIT_MIB:?}
        ports:
            - '127.0.0.1:4318:4318' # for an API run on the host instead of in compose
        volumes:
            - ./docker/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
            - ./docker/otel-collector/docker-logs.yml:/etc/otelcol-contrib/docker-logs.yml:ro
            - ./docker/otel-collector/scrape.yml:/etc/otelcol-contrib/scrape.yml:ro
            # Linux-only path: on Docker Desktop it mounts empty, so traces and metrics flow but Loki
            # receives no logs.
            - /var/lib/docker/containers:/var/lib/docker/containers:ro
            - otel_collector_data:/var/lib/otelcol
        depends_on:
            - tempo
            - prometheus
            - loki
        logging: *logging
        networks:
            - api-network

    grafana:
        image: grafana/grafana:11.5.2@sha256:8b37a2f028f164ce7b9889e1765b9d6ee23fec80f871d156fbf436d6198d32b7
        container_name: grafana
        ports:
            - '4000:3000' # Expose Grafana on host port 4000 to avoid conflicting with NestJS on 3000
        volumes:
            - ./docker/grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
        environment:
            - GF_AUTH_ANONYMOUS_ENABLED=true
            - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
        depends_on:
            - tempo
            - prometheus
            - loki
        logging: *logging
        networks:
            - api-network

networks:
    # Same external bridge the app stack attaches to — see docker-compose.yml.
    api-network:
        external: true
        name: api-network

volumes:
    tempo_data:
    prometheus_data:
    loki_data:
    otel_collector_data:
