name: E2E test
on:
    workflow_call:

env:
    NODE_ENV: test

jobs:
    e2e-test:
        name: E2E tests
        runs-on: ubuntu-24.04

        services:
            postgres:
                image: postgres:18.4-alpine3.23@sha256:96d56f7f57c6aacd1fcb908bc83b345ec5f83231ee486dd66a1baadce274db88
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 2

            redis-cache:
                image: redis:8.6.3-alpine3.23@sha256:d146f83b1e0f02fc27c26a50cee39338c736674c5959db84363e6ae3cd9e02d2
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 2

            redis-session:
                image: redis:8.6.3-alpine3.23@sha256:d146f83b1e0f02fc27c26a50cee39338c736674c5959db84363e6ae3cd9e02d2
                ports:
                    - 6380:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 2

        steps:
            - name: Check out code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            # Start after checkout so the S3 config can be copied into the container.
            - name: Start SeaweedFS
              run: |
                  storage_container=$(docker create \
                    --network host \
                    chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d \
                    server -ip=127.0.0.1 -ip.bind=0.0.0.0 -master.telemetry=false -filer -s3 \
                    -s3.config=/etc/seaweedfs/s3.json -s3.port.iceberg=0 -s3.port.lance=0)
                  echo "STORAGE_CONTAINER=$storage_container" >> "$GITHUB_ENV"
                  docker cp docker/seaweedfs/s3.json "$storage_container:/etc/seaweedfs/s3.json"
                  docker start "$storage_container"
                  curl --retry 30 --retry-delay 1 --retry-connrefused --retry-max-time 30 --connect-timeout 1 --silent --show-error --output /dev/null http://127.0.0.1:8333/

            - name: Prepare S3 test bucket
              run: |
                  docker run --rm -i --network host -e S3_ENDPOINT_URL=http://127.0.0.1:8333 --entrypoint /bin/sh \
                    amazon/aws-cli:2.34.0@sha256:97cc5f847898f54432492c128408c62e0df2153d9ad36573be8e5a03826123b0 \
                    -s storage-test < docker/seaweedfs/setup.sh

            - name: Cache Vitest E2E results
              uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                  path: ${{ github.workspace }}/.vitest-cache-e2e
                  key: ${{ runner.os }}-vitest-e2e-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
                  restore-keys: |
                      ${{ runner.os }}-vitest-e2e-${{ hashFiles('package-lock.json') }}-
                      ${{ runner.os }}-vitest-e2e-

            - name: Cache Schemathesis results
              uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                  path: ${{ github.workspace }}/.hypothesis
                  key: ${{ runner.os }}-schemathesis-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
                  restore-keys: |
                      ${{ runner.os }}-schemathesis-${{ hashFiles('package-lock.json') }}-
                      ${{ runner.os }}-schemathesis-

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  cache: 'npm'
                  node-version: '24'

            - name: Install Node dependencies
              run: npm ci

            - name: Download build artifacts
              uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
              with:
                  name: dist
                  path: dist/

            - name: Lint Swagger contract
              run: npm run lint:contract

            - name: Push database schema
              run: npm run db:push -- --force

            - name: Run end-to-end tests
              run: npm run test:e2e

            - name: Setup Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: '3.13'

            - name: Install Schemathesis
              run: pip install schemathesis

            - name: Run dynamic contract tests
              run: |
                  npm run ci:start:wait
                  npm run test:contract

            - name: Remove S3 test container
              if: always()
              run: |
                  if [ -n "${STORAGE_CONTAINER:-}" ]; then
                    docker rm -fv "$STORAGE_CONTAINER"
                  fi
