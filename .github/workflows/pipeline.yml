name: CI/CD Pipeline

on:
    push:
        branches:
            - main
            - development
        paths:
            - 'src/**'
            - 'test/**'
            - '.github/workflows/**'
            - 'package.json'
            - 'package-lock.json'
            - 'tsconfig*.json'
            - 'nest-cli.json'
            - '.spectral.yml'
            - 'eslint.config.mjs'
            - '.prettierrc'
            - 'Dockerfile'
            - 'docker-compose.yml'
    pull_request:
        branches:
            - main
            - development
        types: [opened, synchronize, reopened]
        paths:
            - 'src/**'
            - 'test/**'
            - '.github/workflows/**'
            - 'package.json'
            - 'package-lock.json'
            - 'tsconfig*.json'
            - 'nest-cli.json'
            - '.spectral.yml'
            - 'eslint.config.mjs'
            - '.prettierrc'
            - 'Dockerfile'
            - 'docker-compose.yml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    quality:
        name: Quality
        uses: ./.github/workflows/quality.yml

    unit-test:
        name: Unit test
        needs: quality
        uses: ./.github/workflows/unit-test.yml

    build:
        name: Build
        needs: quality
        uses: ./.github/workflows/build.yml

    integration-test:
        name: Integration test
        needs: [unit-test, build]
        uses: ./.github/workflows/integration-test.yml

    publish-docs:
        name: Publish documentation
        needs: integration-test
        runs-on: ubuntu-24.04
        steps:
            - name: Download build artifacts
              uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
              with:
                  name: dist
                  path: dist/

            - name: Upload Swagger documentation
              uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
              with:
                  name: docs
                  path: dist/docs/
                  overwrite: true
