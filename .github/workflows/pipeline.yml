name: CI/CD Pipeline

on:
    push:
        branches:
            - main
            - development
        paths:
            - 'src/**'
            - 'test/**'
            - 'drizzle/**'
            - 'script/**'
            - 'audit-ci.jsonc'
            - '.github/workflows/**'
            - 'package.json'
            - 'package-lock.json'
            - 'tsconfig*.json'
            - 'nest-cli.json'
            - 'vitest.config*.mts'
            - 'drizzle.config.ts'
            - '.spectral.yml'
            - 'eslint.config.mjs'
            - '.prettierrc'
            - 'Dockerfile'
            - 'docker-compose*.yml'
    pull_request:
        branches:
            - main
            - development
        types: [opened, synchronize, reopened]
        paths:
            - 'src/**'
            - 'test/**'
            - 'drizzle/**'
            - 'script/**'
            - 'audit-ci.jsonc'
            - '.github/workflows/**'
            - 'package.json'
            - 'package-lock.json'
            - 'tsconfig*.json'
            - 'nest-cli.json'
            - 'vitest.config*.mts'
            - 'drizzle.config.ts'
            - '.spectral.yml'
            - 'eslint.config.mjs'
            - '.prettierrc'
            - 'Dockerfile'
            - 'docker-compose*.yml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    quality:
        name: Quality
        uses: ./.github/workflows/quality.yml

    unit-test:
        name: Unit test
        needs: quality
        uses: ./.github/workflows/unit-test.yml

    build:
        name: Build
        needs: quality
        uses: ./.github/workflows/build.yml

    e2e-test:
        name: E2E test
        needs: [unit-test, build]
        uses: ./.github/workflows/e2e-test.yml

    publish-docs:
        name: Publish documentation
        needs: e2e-test
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: ./.github/workflows/publish-docs.yml
        with:
            SDK_REPO: ${{ vars.SDK_REPO }}
        secrets:
            SDK_REPO_PAT: ${{ secrets.SDK_REPO_PAT }}
