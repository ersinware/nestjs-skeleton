name: Unit test
on:
    workflow_call:

jobs:
    unit-test:
        name: Unit tests & coverage
        runs-on: ubuntu-24.04

        steps:
            - name: Check out code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Cache Jest results
              uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                  path: ${{ github.workspace }}/.jest-cache
                  key: ${{ runner.os }}-jest-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
                  restore-keys: |
                      ${{ runner.os }}-jest-${{ hashFiles('package-lock.json') }}-
                      ${{ runner.os }}-jest-

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  cache: 'npm'
                  node-version: '24'

            - name: Install dependencies
              run: npm ci

            - name: Run unit tests
              run: npm run test:cov -- --cache --cacheDirectory="${{ github.workspace }}/.jest-cache"

            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: coverage-report
                  path: coverage/
                  overwrite: true
