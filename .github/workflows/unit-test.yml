name: Unit test
on:
    workflow_call:

jobs:
    unit-test:
        name: Unit tests & coverage
        runs-on: ubuntu-24.04

        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Cache Jest results
              uses: actions/cache@v4
              with:
                  path: ${{ github.workspace }}/.jest-cache
                  key: ${{ runner.os }}-jest-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
                  restore-keys: |
                      ${{ runner.os }}-jest-${{ hashFiles('package-lock.json') }}-
                      ${{ runner.os }}-jest-

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  cache: 'npm'
                  node-version: '24'

            - name: Install dependencies
              run: npm ci

            - name: Run unit tests
              run: npm run test:cov -- --cache --cacheDirectory="${{ github.workspace }}/.jest-cache"

            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: coverage/
                  overwrite: true
