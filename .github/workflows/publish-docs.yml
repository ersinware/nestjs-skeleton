name: Publish Documentation & SDK

on:
    workflow_call:
        inputs:
            SDK_REPO:
                type: string
                required: true
        secrets:
            SDK_REPO_PAT:
                required: true

jobs:
    publish:
        name: Publish
        runs-on: ubuntu-24.04
        steps:
            - name: Download build artifacts
              uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
              with:
                  name: dist
                  path: dist/

            - name: Upload Swagger documentation
              uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
              with:
                  name: docs
                  path: dist/docs/
                  overwrite: true

            - name: Push API Client to SDK Repository
              env:
                  SDK_REPO_PAT: ${{ secrets.SDK_REPO_PAT }}
                  SDK_REPO: ${{ inputs.SDK_REPO }}
                  BRANCH_NAME: ${{ github.ref_name }}
              run: |
                  if [ -z "$SDK_REPO" ]; then
                      echo "::error::The repository variable SDK_REPO is not set (Settings → Secrets and variables → Actions → Variables)."
                      exit 1
                  fi

                  if [ -z "$SDK_REPO_PAT" ]; then
                      echo "::error::The repository secret SDK_REPO_PAT is not set (Settings → Secrets and variables → Actions → Secrets)."
                      exit 1
                  fi

                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"

                  git clone "https://x-access-token:${SDK_REPO_PAT}@${SDK_REPO}" sdk-repo
                  cd sdk-repo

                  git checkout -B "$BRANCH_NAME"

                  cp ../dist/docs/api-client.ts ./api-client.ts

                  git add api-client.ts

                  if git diff --cached --quiet; then
                      echo "No changes in API client. Skipping push."
                  else
                      git commit -m "chore: update API client types [skip ci]"
                      git push origin "$BRANCH_NAME"
                  fi
