name: Quality
on:
    workflow_call:

jobs:
    quality-security:
        name: Quality & security
        runs-on: ubuntu-24.04

        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Check for Shadow APIs
              run: npm run check:shadow-api

            - name: Cache linter results
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ github.workspace }}/.eslintcache
                      ${{ github.workspace }}/.prettiercache
                  key: ${{ runner.os }}-lint-cache-${{ hashFiles('package-lock.json', '.prettierrc', 'eslint.config.mjs') }}-${{ github.run_id }}
                  restore-keys: |
                      ${{ runner.os }}-lint-cache-${{ hashFiles('package-lock.json', '.prettierrc', 'eslint.config.mjs') }}-
                      ${{ runner.os }}-lint-cache-

            - name: Cache TypeScript build results
              uses: actions/cache@v4
              with:
                  path: ${{ github.workspace }}/.tsbuildinfo
                  key: ${{ runner.os }}-ts-cache-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-${{ github.run_id }}
                  restore-keys: |
                      ${{ runner.os }}-ts-cache-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-
                      ${{ runner.os }}-ts-cache-

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  cache: 'npm'
                  node-version: '24'

            - name: Install dependencies
              run: npm ci

            - name: Check for vulnerabilities
              run: npm run audit

            - name: Format check
              run: npm run format:check

            - name: Lint check
              run: npm run lint

            - name: Type check
              run: npm run test:type
