name: Build
on:
    workflow_call:

env:
    NODE_ENV: test

jobs:
    build:
        name: Build
        runs-on: ubuntu-24.04

        steps:
            - name: Check out code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  cache: 'npm'
                  node-version: '24'

            - name: Cache TypeScript build results
              uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                  path: ${{ github.workspace }}/.tsbuildinfo
                  key: ${{ runner.os }}-ts-cache-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-${{ github.run_id }}
                  restore-keys: |
                      ${{ runner.os }}-ts-cache-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-
                      ${{ runner.os }}-ts-cache-

            - name: Install dependencies
              run: npm ci

            - name: Build app & generate Swagger files
              run: npm run build:ci

            - name: Upload build artifacts
              uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
              with:
                  name: dist
                  path: dist/
                  retention-days: 1
                  overwrite: true
