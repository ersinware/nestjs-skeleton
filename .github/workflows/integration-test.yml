name: Integration test
on:
    workflow_call:

jobs:
    integration-test:
        name: Integration tests
        runs-on: ubuntu-24.04

        steps:
            - name: Check out code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Cache Jest E2E results
              uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                  path: ${{ github.workspace }}/.jest-cache-e2e
                  key: ${{ runner.os }}-jest-e2e-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
                  restore-keys: |
                      ${{ runner.os }}-jest-e2e-${{ hashFiles('package-lock.json') }}-
                      ${{ runner.os }}-jest-e2e-

            - name: Cache Schemathesis results
              uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                  path: ${{ github.workspace }}/.hypothesis
                  key: ${{ runner.os }}-schemathesis-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
                  restore-keys: |
                      ${{ runner.os }}-schemathesis-${{ hashFiles('package-lock.json') }}-
                      ${{ runner.os }}-schemathesis-

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  cache: 'npm'
                  node-version: '24'

            - name: Install Node dependencies
              run: npm ci

            - name: Download build artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: dist
                  path: dist/

            - name: Lint Swagger contract
              run: npm run lint:contract

            - name: Run end-to-end tests
              if: always()
              run: npm run test:e2e -- --cache --cacheDirectory="${{ github.workspace }}/.jest-cache-e2e"

            - name: Setup Python
              if: always()
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: '3.13'

            - name: Install Schemathesis
              if: always()
              run: pip install schemathesis

            - name: Run dynamic contract tests
              if: always()
              run: |
                  npm run start:wait
                  npm run test:contract
