apiVersion: 1

datasources:
    - name: Prometheus
      type: prometheus
      uid: Prometheus
      url: http://prometheus:9090
      isDefault: true

    - name: Loki
      type: loki
      uid: Loki
      url: http://loki:3100
      jsonData:
          # Extracts `traceId` from JSON log lines and links each log to its Jaeger trace.
          derivedFields:
              - datasourceUid: Jaeger
                matcherRegex: '"traceId":"(\w+)"'
                name: TraceID
                url: '$${__value.raw}'

    - name: Jaeger
      type: jaeger
      uid: Jaeger
      url: http://jaeger:16686
      jsonData:
          nodeGraph:
              enabled: true
