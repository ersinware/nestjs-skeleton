# Tempo — local trace store, fed by the collector over OTLP. The same backend serves Grafana Cloud,
# so TraceQL queries carry over unchanged.
server:
    http_listen_port: 3200

distributor:
    receivers:
        otlp:
            protocols:
                http:
                    endpoint: 0.0.0.0:4318

storage:
    trace:
        backend: local
        local:
            path: /var/tempo/blocks
        wal:
            path: /var/tempo/wal

# Derives RED metrics per span and the service graph from ingested traces, written to Prometheus.
# Grafana's service map reads them from there (datasources.yml `serviceMap`).
metrics_generator:
    # Spans reach Tempo only after the collector's tail-sampling wait (decision_wait), so the default
    # 30s slack would discard every one of them as too old.
    metrics_ingestion_time_range_slack: 2m
    registry:
        external_labels:
            source: tempo
    storage:
        path: /var/tempo/generator/wal
        remote_write:
            - url: http://prometheus:9090/api/v1/write
              send_exemplars: true

# Retention and the generator's processors are tenant settings; `defaults` covers the single tenant.
overrides:
    defaults:
        compaction:
            block_retention: 48h
        metrics_generator:
            processors: [service-graphs, span-metrics]
