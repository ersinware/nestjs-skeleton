global:
    scrape_interval: 15s

scrape_configs:
    - job_name: 'prometheus'
      static_configs:
          - targets: ['localhost:9090']

    - job_name: 'postgres'
      static_configs:
          - targets: ['postgres-exporter:9187']

    - job_name: 'redis-cache'
      static_configs:
          - targets: ['redis-cache-exporter:9121']

    - job_name: 'redis-session'
      static_configs:
          - targets: ['redis-session-exporter:9121']
