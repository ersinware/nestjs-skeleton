# Prometheus — local metrics store. It scrapes nothing: every series, exporter scrapes included,
# arrives from the collector over the OTLP receiver (`--web.enable-otlp-receiver`).
global:
    scrape_interval: 15s

scrape_configs: []

storage:
    tsdb:
        # OTLP batches arrive out of order; without this window their samples are rejected.
        out_of_order_time_window: 30m

otlp:
    # Kept as labels instead of being folded into `target_info`.
    promote_resource_attributes:
        - service.name
        - service.namespace
        - service.instance.id
        - deployment.environment.name
