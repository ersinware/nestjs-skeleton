# Global Prometheus configuration
global:
    # How frequently to scrape targets by default
    scrape_interval: 15s

# Scrape configurations defining targets to monitor
scrape_configs:
    # Monitors Prometheus's own runtime metrics
    - job_name: 'prometheus'
      static_configs:
          - targets: ['localhost:9090']

    # Monitors PostgreSQL health, connection counts, and query metrics via the exporter
    - job_name: 'postgres'
      static_configs:
          - targets: ['postgres-exporter:9187']

    # Monitors memory usage, hit/miss ratios, and eviction rates for the caching Redis instance
    - job_name: 'redis-cache'
      static_configs:
          - targets: ['redis-cache-exporter:9121']

    # Monitors stateful Redis metrics including session tracking, rate-limiting, and queue statuses
    - job_name: 'redis-state'
      static_configs:
          - targets: ['redis-state-exporter:9121']
