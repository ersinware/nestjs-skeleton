# Forwarding configuration with local persistent queues; Grafana Cloud stores telemetry history.
# Use localhost binding on Fargate; Compose needs the container interface.
extensions:
    # Shared by exporter queues and local Docker log read offsets.
    file_storage:
        directory: /var/lib/otelcol
        create_directory: true
        fsync: true

receivers:
    otlp:
        protocols:
            http:
                endpoint: ${env:OTEL_COLLECTOR_LISTEN_ADDRESS}

processors:
    memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
    batch:
        timeout: 5s
        send_batch_size: 512
        send_batch_max_size: 1024

exporters:
    otlp_http:
        # Portal OTLP gateway base, including /otlp; exporter adds /v1/<signal>.
        endpoint: ${env:GRAFANA_CLOUD_OTLP_ENDPOINT}
        headers:
            Authorization: ${env:GRAFANA_CLOUD_OTLP_HEADERS}
        timeout: 10s
        sending_queue:
            enabled: true
            storage: file_storage
            num_consumers: 2
            queue_size: 256
        retry_on_failure:
            enabled: true
            initial_interval: 1s
            max_interval: 30s
            max_elapsed_time: 300s

service:
    extensions: [file_storage]
    pipelines:
        traces:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [otlp_http]
        metrics:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [otlp_http]
