# Forwarding configuration with local persistent queues; Grafana Cloud stores telemetry history.
# Use localhost binding on Fargate; Compose needs the container interface.
extensions:
    # Shared by exporter queues and local Docker log read offsets.
    file_storage:
        directory: /var/lib/otelcol
        create_directory: true
        fsync: true

receivers:
    otlp:
        protocols:
            http:
                endpoint: ${env:OTEL_COLLECTOR_LISTEN_ADDRESS}

processors:
    memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
    # All spans of a trace must reach this Collector; route by trace ID when scaling.
    # Pending traces live in memory, outside the persistent exporter queue.
    tail_sampling:
        decision_wait: 30s
        num_traces: 10000
        decision_cache:
            sampled_cache_size: 100000
            non_sampled_cache_size: 100000
        # Policies are OR-ed: preserve errors/slow traces, sample the remainder.
        policies:
            - name: errors
              type: status_code
              status_code:
                  status_codes: [ERROR]
            - name: slow
              type: latency
              latency:
                  threshold_ms: ${env:OTEL_COLLECTOR_TRACES_SLOW_THRESHOLD_MS}
            - name: baseline
              type: probabilistic
              probabilistic:
                  sampling_percentage: ${env:OTEL_COLLECTOR_TRACES_SAMPLING_PERCENTAGE}
    batch:
        timeout: 5s
        send_batch_size: 512
        send_batch_max_size: 1024

exporters:
    otlp_http:
        # Portal OTLP gateway base, including /otlp; exporter adds /v1/<signal>.
        endpoint: ${env:GRAFANA_CLOUD_OTLP_ENDPOINT}
        headers:
            Authorization: ${env:GRAFANA_CLOUD_OTLP_HEADERS}
        timeout: 10s
        sending_queue:
            enabled: true
            storage: file_storage
            num_consumers: 2
            queue_size: 256
        retry_on_failure:
            enabled: true
            initial_interval: 1s
            max_interval: 30s
            max_elapsed_time: 300s

service:
    extensions: [file_storage]
    pipelines:
        traces:
            receivers: [otlp]
            processors: [memory_limiter, tail_sampling, batch]
            exporters: [otlp_http]
        metrics:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [otlp_http]
