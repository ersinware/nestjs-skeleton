# OpenTelemetry Collector — the single telemetry gateway. The app pushes traces and metrics here
# over OTLP and writes logs to stdout; where the collector ships them is decided by the
# OTEL_COLLECTOR_* variables it starts with, so a backend swap never touches the app.
#
# Portable base: nothing here assumes a host, so it runs as-is in compose, on a VM, or as a Fargate
# sidecar. Docker-host concerns are separate `--config` overlays (merged; lists replace):
#   docker-logs.yml — container stdout from Docker's json-file logs (a Fargate task has none)
#   scrape.yml      — self-hosted Postgres/Redis exporters (RDS/ElastiCache report to CloudWatch)
#
# Every backend (Tempo, Prometheus, Loki, Grafana Cloud) ingests OTLP/HTTP, so one exporter with
# per-signal endpoints covers dev and prod.
#
# OTEL_TAIL_SAMPLING_PERCENTAGE: 100 keeps every trace (default), 10 keeps 1 in 10 of the ordinary
# ones. Errors and slow traces are always kept.

receivers:
    otlp:
        protocols:
            http:
                endpoint: 0.0.0.0:4318
            grpc:
                endpoint: 0.0.0.0:4317

processors:
    # Above the soft limit new data is refused (the app's exporters fail open),
    # above soft + spike GC is forced. Both are set beside the container's memory limit.
    memory_limiter:
        check_interval: 1s
        limit_mib: ${env:OTEL_COLLECTOR_MEMORY_LIMIT_MIB}
        spike_limit_mib: ${env:OTEL_COLLECTOR_MEMORY_SPIKE_LIMIT_MIB}

    # Policies are OR-ed: a trace is kept if any policy elects it.
    tail_sampling:
        # Longest expected request plus the SDK's export interval, or late spans are judged as a
        # truncated trace.
        decision_wait: 30s
        # Traces held in memory while waiting: at least rate x decision_wait, with headroom for bursts.
        # Scale these two together with traffic; decision_wait stays.
        num_traces: 100000
        expected_new_traces_per_sec: 1000
        policies:
            - name: keep-errors
              type: status_code
              status_code:
                  status_codes: [ERROR]
            - name: keep-slow
              type: latency
              latency:
                  threshold_ms: 200
            - name: sample-the-rest
              type: probabilistic
              probabilistic:
                  sampling_percentage: ${env:OTEL_TAIL_SAMPLING_PERCENTAGE}

    # After sampling, so only kept traces are batched.
    batch: {}

exporters:
    # Local: the three stores, empty Authorization (ignored by unauthenticated backends).
    # Grafana Cloud: all three on the gateway, Authorization = `Basic <base64 instance:token>`.
    otlp_http:
        traces_endpoint: ${env:OTEL_COLLECTOR_TRACES_ENDPOINT}
        metrics_endpoint: ${env:OTEL_COLLECTOR_METRICS_ENDPOINT}
        logs_endpoint: ${env:OTEL_COLLECTOR_LOGS_ENDPOINT}
        headers:
            Authorization: ${env:OTEL_COLLECTOR_AUTHORIZATION}

service:
    pipelines:
        traces:
            receivers: [otlp]
            processors: [memory_limiter, tail_sampling, batch]
            exporters: [otlp_http]
        metrics:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [otlp_http]
