# OpenTelemetry Collector — tail-sampling gateway between the API and Jaeger.
#
# The app exports 100% of its spans here; the keep/drop decision is made after each trace completes,
# on its OUTCOME (error / latency) — which head sampling in the app cannot see.
#
# One knob, OTEL_TAIL_SAMPLING_PERCENTAGE (passed in by docker-compose):
#   100 -> keep every trace = tail sampling OFF (the default)
#    10 -> keep 1 in 10 of the ordinary traces
# Errors and slow traces are ALWAYS kept regardless — turning the knob down never costs the traces
# worth reading.

receivers:
    otlp:
        protocols:
            http:
                endpoint: 0.0.0.0:4318
            grpc:
                endpoint: 0.0.0.0:4317

processors:
    # Policies are OR-ed: a trace is kept if ANY policy elects it.
    tail_sampling:
        # Wait before deciding — must exceed the slowest expected request, or late spans are judged
        # as a truncated (and misleadingly fast) trace.
        decision_wait: 10s
        num_traces: 50000
        expected_new_traces_per_sec: 100
        policies:
            - name: keep-errors
              type: status_code
              status_code:
                  status_codes: [ERROR]
            - name: keep-slow
              type: latency
              latency:
                  threshold_ms: 200
            - name: sample-the-rest
              type: probabilistic
              probabilistic:
                  # The single knob. 100 = keep all (OFF), lower = shed ordinary-traffic volume.
                  sampling_percentage: ${env:OTEL_TAIL_SAMPLING_PERCENTAGE}

    # Batches AFTER the sampling decision so only kept traces are shipped onward.
    batch: {}

exporters:
    # Forward the surviving traces to Jaeger over OTLP/HTTP.
    otlphttp/jaeger:
        endpoint: http://jaeger:4318

service:
    pipelines:
        traces:
            receivers: [otlp]
            processors: [tail_sampling, batch]
            exporters: [otlphttp/jaeger]
