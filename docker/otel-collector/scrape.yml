# Overlay for self-hosted Postgres/Redis: scrapes their exporters into the metrics pipeline.
# Not loaded with managed datastores (RDS, ElastiCache), whose metrics come from CloudWatch.
receivers:
    prometheus:
        config:
            global:
                scrape_interval: 15s
            scrape_configs:
                - job_name: postgres
                  static_configs:
                      - targets: ['postgres-exporter:9187']
                - job_name: redis-cache
                  static_configs:
                      - targets: ['redis-cache-exporter:9121']
                - job_name: redis-session
                  static_configs:
                      - targets: ['redis-session-exporter:9121']

service:
    pipelines:
        metrics:
            receivers: [otlp, prometheus]
