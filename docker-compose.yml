# Local application stack; enable the observability profile to send telemetry to Grafana Cloud.

# Stamps the compose service name — and, where a container carries one, its `service.name` label —
# into each log line; the collector names the source from them (docker-logs.yml).
x-logging: &logging
    driver: json-file
    options:
        labels: com.docker.compose.service,service.name,deployment.environment.name,telemetry.logs

services:
    postgres:
        image: postgres:18.4-alpine3.23@sha256:96d56f7f57c6aacd1fcb908bc83b345ec5f83231ee486dd66a1baadce274db88
        container_name: postgres
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: postgres
        ports:
            - '5432:5432'
        volumes:
            - pg_data_vol:/var/lib/postgresql
        logging: *logging
        networks:
            - api-network

    redis-cache:
        image: redis:8.6.3-alpine3.23@sha256:d146f83b1e0f02fc27c26a50cee39338c736674c5959db84363e6ae3cd9e02d2
        container_name: redis-cache
        restart: always
        command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru --loglevel warning --requirepass "password"
        ports:
            - '6379:6379'
        logging: *logging
        networks:
            - api-network

    redis-session:
        image: redis:8.6.3-alpine3.23@sha256:d146f83b1e0f02fc27c26a50cee39338c736674c5959db84363e6ae3cd9e02d2
        container_name: redis-session
        restart: always
        command: redis-server --save 60 1 --appendonly yes --appendfsync everysec --loglevel warning --requirepass "password"
        ports:
            - '6380:6379'
        volumes:
            - redis_session_data:/data
        logging: *logging
        networks:
            - api-network

    seaweedfs:
        image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
        container_name: seaweedfs
        restart: always
        # server starts no lifecycle worker; mini starts additional background components.
        command: >-
            server -ip=seaweedfs -ip.bind=0.0.0.0
            -master.telemetry=false -filer -s3
            -s3.config=/etc/seaweedfs/s3.json
            -s3.port.iceberg=0 -s3.port.lance=0
        ports:
            - '127.0.0.1:8333:8333'
        volumes:
            - seaweedfs_data:/data
            - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
        healthcheck:
            test:
                - CMD-SHELL
                - wget -q -O /dev/null http://localhost:9333/cluster/status && wget -q -O /dev/null http://localhost:8888/ && nc -z localhost 8333
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 10s
        logging: *logging
        networks:
            api-network:
                aliases:
                    - storage.localhost

    storage-init:
        image: amazon/aws-cli:2.34.0@sha256:97cc5f847898f54432492c128408c62e0df2153d9ad36573be8e5a03826123b0
        depends_on:
            seaweedfs:
                condition: service_healthy
        entrypoint: ['/bin/sh', '/etc/seaweedfs/setup.sh']
        command: ['storage-development']
        volumes:
            - ./docker/seaweedfs:/etc/seaweedfs:ro
        logging: *logging
        networks:
            - api-network

    api:
        environment:
            OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:?}
        # Build context is common for both envs
        build:
            context: .
        # The app's own service name on its log lines, so a log and the trace it belongs to share
        # one `service.name` in Grafana.
        labels:
            service.name: ${OTEL_SERVICE_NAME:?}
            deployment.environment.name: local
            telemetry.logs: 'true'
        logging: *logging
        networks:
            - api-network

    otel-collector:
        profiles: [observability]
        image: otel/opentelemetry-collector-contrib:0.157.0@sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6
        # Linux Docker log files require root; Fargate does not load this overlay.
        user: '0'
        mem_limit: 512m
        stop_grace_period: 30s
        env_file:
            - path: .env.observability
              required: true
        command:
            - --config=/etc/otelcol/config.yml
            - --config=/etc/otelcol/docker-logs.yml
        ports:
            - '127.0.0.1:4318:4318'
        volumes:
            - ./docker/otel-collector/config.yml:/etc/otelcol/config.yml:ro
            - ./docker/otel-collector/docker-logs.yml:/etc/otelcol/docker-logs.yml:ro
            - /var/lib/docker/containers:/var/lib/docker/containers:ro
            - otel_collector_data:/var/lib/otelcol
        networks: [api-network]

networks:
    # Retained for existing local environments; npm scripts create it if missing.
    api-network:
        external: true
        name: api-network

volumes:
    pg_data_vol:
    redis_session_data:
    seaweedfs_data:
    # Exporter queues and log offsets survive recreation; docker:*:down:clean removes them.
    otel_collector_data:
