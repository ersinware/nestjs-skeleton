services:
    postgres:
        image: postgres:18.4-alpine3.23@sha256:96d56f7f57c6aacd1fcb908bc83b345ec5f83231ee486dd66a1baadce274db88
        container_name: postgres
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: postgres
        ports:
            - '5432:5432'
        volumes:
            - pg_data_vol:/var/lib/postgresql
        networks:
            - api-network

    redis-cache:
        image: redis:8.6.3-alpine3.23@sha256:d146f83b1e0f02fc27c26a50cee39338c736674c5959db84363e6ae3cd9e02d2
        container_name: redis-cache
        restart: always
        command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru --loglevel warning --requirepass "password"
        ports:
            - '6379:6379'
        networks:
            - api-network

    redis-state:
        image: redis:8.6.3-alpine3.23@sha256:d146f83b1e0f02fc27c26a50cee39338c736674c5959db84363e6ae3cd9e02d2
        container_name: redis-state
        restart: always
        command: redis-server --save 60 1 --loglevel warning --requirepass "password"
        ports:
            - '6380:6379'
        volumes:
            - redis_state_data:/data
        networks:
            - api-network

    api:
        # Build context is common for both envs
        build:
            context: .
        networks:
            - api-network

    prometheus:
        image: prom/prometheus:latest@sha256:a75c5a35bc21d7afe69551eefa3cb1e1fb1775fe759408007a66b54ec3de1f29
        container_name: prometheus
        ports:
            - '4319:4318' # OTLP HTTP receiver (mapped to 4319 to avoid conflict with Jaeger on host)
        volumes:
            - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.enable-otlp-receiver'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        networks:
            - api-network

    jaeger:
        image: jaegertracing/all-in-one:latest@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
        container_name: jaeger
        ports:
            - '4318:4318' # OTLP HTTP receiver
        networks:
            - api-network

    otel-collector:
        # Tail-sampling gateway in front of Jaeger. The API exports 100% of its traces here; this is
        # where the keep/drop decision is made on the completed trace's outcome (see
        # docker/otel-collector/config.yml). Contrib image — tail_sampling is not in the core distro.
        image: otel/opentelemetry-collector-contrib:0.157.0@sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6
        container_name: otel-collector
        command: ['--config=/etc/otelcol-contrib/config.yml']
        environment:
            # The single on/off knob. 100 = keep every trace (OFF, default); lower it to sample.
            # Read from the project-root .env by compose, defaulting to 100 when unset.
            - OTEL_TAIL_SAMPLING_PERCENTAGE=${OTEL_TAIL_SAMPLING_PERCENTAGE:-100}
        volumes:
            - ./docker/otel-collector/config.yml:/etc/otelcol-contrib/config.yml
        depends_on:
            - jaeger
        networks:
            - api-network

    loki:
        image: grafana/loki:3.4.2@sha256:58a6c186ce78ba04d58bfe2a927eff296ba733a430df09645d56cdc158f3ba08
        container_name: loki
        networks:
            - api-network

    promtail:
        image: grafana/promtail:3.4.2@sha256:c6e9a987ca086cbfef945b8ebd708eb09f98b5e78bfb659e4e5a8b3bd604d11b
        container_name: promtail
        volumes:
            - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml
            - /var/run/docker.sock:/var/run/docker.sock:ro
            # NOTE: This path is native to Linux hosts. On macOS/Windows (Docker Desktop), the host does not
            # have this directory, so it will mount as an empty folder. Promtail will start but Loki won't receive logs.
            - /var/lib/docker/containers:/var/lib/docker/containers:ro
        depends_on:
            - loki
        stop_grace_period: 3s
        networks:
            - api-network

    grafana:
        image: grafana/grafana:11.5.2@sha256:8b37a2f028f164ce7b9889e1765b9d6ee23fec80f871d156fbf436d6198d32b7
        container_name: grafana
        ports:
            - '4000:3000' # Expose Grafana on host port 4000 to avoid conflicting with NestJS on 3000
        volumes:
            - ./docker/grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
        environment:
            - GF_AUTH_ANONYMOUS_ENABLED=true
            - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
        networks:
            - api-network

    postgres-exporter:
        image: prometheuscommunity/postgres-exporter:v0.17.1@sha256:38606faa38c54787525fb0ff2fd6b41b4cfb75d455c1df294927c5f611699b17
        container_name: postgres-exporter
        environment:
            - DATA_SOURCE_NAME=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
        networks:
            - api-network

    redis-cache-exporter:
        image: oliver006/redis_exporter:v1.67.0@sha256:120f7ec77293459ccfdad66bb1db75ab72e8bfeab99f58b1cc2564cadcd7a9e7
        container_name: redis-cache-exporter
        environment:
            - REDIS_ADDR=redis://redis-cache:6379
            - REDIS_PASSWORD=password
        networks:
            - api-network

    redis-state-exporter:
        image: oliver006/redis_exporter:v1.67.0@sha256:120f7ec77293459ccfdad66bb1db75ab72e8bfeab99f58b1cc2564cadcd7a9e7
        container_name: redis-state-exporter
        environment:
            - REDIS_ADDR=redis://redis-state:6379
            - REDIS_PASSWORD=password
        networks:
            - api-network

networks:
    api-network:
        driver: bridge

volumes:
    pg_data_vol:
    redis_state_data:
