# Application stack — everything the API needs to RUN, and nothing else.
#
# Observability lives in docker-compose.observability.yml as a SEPARATE Compose project. The two
# stacks meet only on the `api-network` bridge, owned by neither: it is declared `external` in both
# and created by `npm run docker:network`, so each stack starts, restarts and stops without the
# other (the OTLP exporters fail open; set OTEL_SDK_DISABLED=true to silence them).
services:
    postgres:
        image: postgres:18.4-alpine3.23@sha256:96d56f7f57c6aacd1fcb908bc83b345ec5f83231ee486dd66a1baadce274db88
        container_name: postgres
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: postgres
        ports:
            - '5432:5432'
        volumes:
            - pg_data_vol:/var/lib/postgresql
        networks:
            - api-network

    redis-cache:
        image: redis:8.6.3-alpine3.23@sha256:d146f83b1e0f02fc27c26a50cee39338c736674c5959db84363e6ae3cd9e02d2
        container_name: redis-cache
        restart: always
        command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru --loglevel warning --requirepass "password"
        ports:
            - '6379:6379'
        networks:
            - api-network

    redis-session:
        image: redis:8.6.3-alpine3.23@sha256:d146f83b1e0f02fc27c26a50cee39338c736674c5959db84363e6ae3cd9e02d2
        container_name: redis-session
        restart: always
        command: redis-server --save 60 1 --appendonly yes --appendfsync everysec --loglevel warning --requirepass "password"
        ports:
            - '6380:6379'
        volumes:
            - redis_session_data:/data
        networks:
            - api-network

    api:
        # Build context is common for both envs
        build:
            context: .
        networks:
            - api-network

networks:
    # Owned by NEITHER stack. Declaring it non-external here would stamp it with this project's
    # labels, and the observability project would then refuse to attach to it.
    api-network:
        external: true
        name: api-network

volumes:
    pg_data_vol:
    redis_session_data:
